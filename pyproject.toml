[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documind"
version = "0.1.0"
description = "Self-Hosted Document Intelligence Platform with Agentic RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "structlog>=24.0.0",
    "python-magic>=0.4.27",
    "aiofiles>=24.0.0",
    "temporalio>=1.7.0",
    "hvac>=2.3.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "prometheus-client>=0.20.0",
    "cloudevents>=1.10.0",
    "PyJWT[crypto]>=2.7.0",
    "langgraph>=0.2.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
ml = [
    "docling>=2.0.0",
    "rapidocr-onnxruntime>=1.3.0",
    "onnxruntime>=1.18.0",
    "litellm>=1.40.0",
    "langchain>=0.2.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.2.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.10.0",
    "opensearch-py>=2.6.0",
    "neo4j>=5.20.0",
    "FlagEmbedding>=1.2.0",
    "langfuse>=2.40.0",
    "ragas>=0.1.10",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "factory-boy>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
